book:
  title: "Handbuch Materialentwicklung"
  subtitle: "Entwicklung qualitätsvoller Lehr-Lernmaterialien für die Praxis und Forschung"
  site-url: "https://larshoeft.github.io/handbook-material-design-chemistry/"
  # Cover on wide screens, short title on phones
  sidebar:
    collapse-level: 1
    logo: img/cover.svg
    logo-alt: "Handbuch Materialentwicklung"
    title: "Handbuch Materialentwicklung"
  author:
    - name: "Sascha Bernholt"
      id: sb
      orcid: 0000-0003-4045-3795
      email: bernholt@leibniz-ipn.de
      affiliation:
        - ref: ipn
    - name: "Stefanie Lenzer"
      id: sl
      orcid: 0000-0002-4024-6473
      email: lenzers@staff.uni-marburg.de
      affiliation:
        - ref: marburg
  date: today
  chapters:
    - index.qmd
    - intro.qmd
    - part: "Qualitätsvolle Lehr-Lernmaterialien für die Praxis und Forschung entwickeln, einsetzen und evaluieren – Warum?"
      chapters: []
    - part: part_why/_importance.qmd
      chapters:
        - part_why/importance_bridge.qmd
        - part_why/importance_principles.qmd
        - part_why/importance_design.qmd
        # - part_why/_orientations.qmd
    - part: "Qualitätskriterien bei der Entwicklung von Lehr-Lernmaterialien – Wie?"
      chapters: []
    - part: part_how/_frameworks.qmd
      chapters:
        - part_how/frameworks_rec.qmd
        - part_how/frameworks_udl.qmd
        - part_how/frameworks_dbr.qmd
    # - part_how/_criteria_general.qmd
    - part: part_how/_criteria_specific.qmd
      chapters:
        - part_how/criteria_specific_cumulative.qmd
        - part_how/criteria_specific_cognitiveload.qmd
        - part_how/criteria_specific_adaptivity.qmd
        - part_how/criteria_specific_context.qmd
        - part_how/criteria_specific_presence.qmd
        - part_how/criteria_specific_interest.qmd
        - part_how/criteria_specific_oer.qmd
    - summary.qmd

