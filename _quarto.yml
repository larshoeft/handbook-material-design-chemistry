filters:
  - at: pre-quarto
    path: section-authors
  - at: pre-quarto
    path: section-bibliographies
  - at: pre-quarto
    path: german-quotes
  - at: post-quarto
    path: svg-inline

format:
  html:
    theme:
      light: [cosmo, theme-ipn/ipn.scss, theme-ipn/fonts.scss]
      dark: [cosmo, theme-ipn/ipn.scss, theme-ipn/fonts.scss, theme-ipn/ipn-dark.scss]
    css: styles.css
    fig-cap-location: margin
    tbl-cap-location: margin
    reference-location: margin
    include-after-body:
      - figure-zoom.html
      - sidebar-state.html
    template-partials:
      - _extensions/section-authors/title-metadata.html
    anchor-sections: false
    crossrefs-hover: false
    bread-crumbs: false
    page-navigation: false
    number-sections: true
    number-depth: 2
    toc-depth: 2

editor: source
