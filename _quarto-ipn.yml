# Vergleichsprofil: IPN-Farben mit Source Serif 4, Source Sans 3 und Source Code Pro;
# Abbildungsunterschriften und Fußnoten im Rand wie socviz.co
# Rendern: quarto render --profile ipn
project:
  output-dir: _build/ipn

format:
  html:
    theme:
      light: [cosmo, theme-ipn/ipn.scss]
      dark: [cosmo, theme-ipn/ipn.scss, theme-ipn/ipn-dark.scss]
    fig-cap-location: margin
    tbl-cap-location: margin
    reference-location: margin
