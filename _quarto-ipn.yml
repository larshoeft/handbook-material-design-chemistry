# IPN colors with Source Serif 4, Source Sans 3 and Source Code Pro;
# captions and footnotes in the margin as on socviz.co (used for the website)
# Render: quarto render --profile ipn
project:
  output-dir: _build/ipn

format:
  html:
    theme:
      light: [cosmo, theme-ipn/ipn.scss, theme-ipn/fonts.scss]
      dark: [cosmo, theme-ipn/ipn.scss, theme-ipn/fonts.scss, theme-ipn/ipn-dark.scss]
    fig-cap-location: margin
    tbl-cap-location: margin
    reference-location: margin
