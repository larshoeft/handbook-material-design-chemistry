# Comparison profile: IPN colors with Alegreya, Alegreya Sans and
# Alegreya Sans SC; captions and footnotes in the margin as on socviz.co
# Render: quarto render --profile ipn-alegreya
project:
  output-dir: _build/ipn-alegreya

format:
  html:
    theme:
      light: [cosmo, theme-ipn/ipn.scss, theme-ipn/font-alegreya.scss]
      dark: [cosmo, theme-ipn/ipn.scss, theme-ipn/font-alegreya.scss, theme-ipn/ipn-dark.scss]
    fig-cap-location: margin
    tbl-cap-location: margin
    reference-location: margin
