<script>
// Click or Enter on a figure opens an enlarged copy; the copy stays in the page, so theme colors apply
document.addEventListener('DOMContentLoaded', () => {
  const dialog = document.createElement('dialog');
  dialog.className = 'figure-zoom';
  dialog.addEventListener('click', () => dialog.close());
  document.body.appendChild(dialog);
  document.querySelectorAll('#quarto-document-content figure :is(svg.svg-inline, img)').forEach(figure => {
    const open = () => {
      const copy = figure.cloneNode(true);
      copy.removeAttribute('id');
      copy.removeAttribute('style');
      copy.removeAttribute('tabindex');
      dialog.replaceChildren(copy);
      dialog.showModal();
    };
    figure.classList.add('zoomable');
    figure.tabIndex = 0;
    figure.addEventListener('click', open);
    figure.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        open();
      }
    });
  });
});
</script>
