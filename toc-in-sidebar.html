<script>
// Sections in the sidebar come from _scripts/sidebar_sections.lua; a tap on one of this page closes the menu
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('#quarto-sidebar .sidebar-page-toc a').forEach(link => {
    link.addEventListener('click', () => {
      if (link.pathname === location.pathname) document.querySelector('.quarto-btn-toggle')?.click();
    });
  });
});
</script>
