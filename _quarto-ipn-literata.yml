# Comparison profile: IPN colors with Literata, Source Sans 3 and
# Source Code Pro; captions and footnotes in the margin as on socviz.co
# Render: quarto render --profile ipn-literata
project:
  output-dir: _build/ipn-literata

# Font variant of the TikZ figures, see img/tikz/build.lua
figure-variant: ipn

# Sidebar: cover on wide screens, short title on phones
book:
  sidebar:
    logo: img/cover.ipn.svg
    logo-alt: "Handbuch Materialentwicklung"
    title: "Handbuch Materialentwicklung"

format:
  html:
    theme:
      light: [cosmo, theme-ipn/ipn.scss, theme-ipn/fonts.scss, theme-ipn/font-literata.scss]
      dark: [cosmo, theme-ipn/ipn.scss, theme-ipn/fonts.scss, theme-ipn/font-literata.scss, theme-ipn/ipn-dark.scss]
    fig-cap-location: margin
    tbl-cap-location: margin
    reference-location: margin
